name: fraud-engine

services:
  kafka:
    image: apache/kafka:4.2.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${KAFKA_PORT}:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [backend, host-access]

  kafka-init:
    image: apache/kafka:4.2.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    networks: [backend]

  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CONTROL_DB_USER: ${CONTROL_DB_USER}
      CONTROL_DB_PASSWORD: ${CONTROL_DB_PASSWORD}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-service-identities.sh:/docker-entrypoint-initdb.d/10-service-identities.sh:ro
    networks: [backend]

  mailpit:
    image: axllent/mailpit:v1.31.0
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend, host-access]

  fraud-control-service:
    build:
      context: .
      dockerfile: services/fraud-control-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      CONTROL_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      CONTROL_DB_USERNAME: ${CONTROL_DB_USER}
      CONTROL_DB_PASSWORD: ${CONTROL_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CONTROL_JWT_PUBLIC_KEY_LOCATION: file:/app/security/rule-control-public.pem
    volumes:
      - ./.local/security/rule-control-public.pem:/app/security/rule-control-public.pem:ro
    ports:
      - "127.0.0.1:${CONTROL_PORT}:8080"
    networks: [backend, host-access]

  detection-engine:
    build:
      context: .
      dockerfile: services/detection-engine/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DETECTION_KAFKA_APPLICATION_ID: fraud-detection-engine
      DETECTION_PORT: 8081
    ports:
      - "127.0.0.1:${DETECTION_PORT}:8081"
    networks: [backend, host-access]

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      NOTIFICATION_DB_USERNAME: ${NOTIFICATION_DB_USER}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      NOTIFICATION_FIXTURE_EMAIL: customer@example.test
      NOTIFICATION_FROM_EMAIL: fraud-engine@example.test
    networks: [backend]

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT}:9090"
    networks: [backend, host-access]

  grafana:
    image: grafana/grafana:13.2.1-slim
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    networks: [backend, host-access]

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT}:8080"
    networks: [backend, host-access]

volumes:
  kafka-data:
  postgres-data:

networks:
  backend:
    internal: true
  host-access:
